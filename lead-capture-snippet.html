<!--
  Building Brain — lead capture form snippet

  Drop this into any client site's contact/enquiry page in place of a
  plain mailto: form. Replace CLIENT_ID_HERE with that client's real
  bb_clients.id (find it in Workshop — it's in the URL or the client
  record). Style the form/inputs however matches the site's own CSS;
  only the name/id attributes and the script below actually matter.

  What this buys you: every submission lands in Building Brain as a real
  bb_leads row with a timestamp, shows up in the client's Activity tab and
  the homepage "needs attention" signal if nobody's responded, and starts
  the response-time clock the moment it's submitted — not when someone
  happens to check their email.
-->

<form id="bb-enquiry-form">
  <input type="text" name="name" placeholder="Your name" required>
  <input type="email" name="email" placeholder="Your email">
  <input type="tel" name="phone" placeholder="Your phone">
  <textarea name="message" placeholder="How can we help?" rows="4"></textarea>

  <!-- Honeypot — invisible to real visitors, bots that fill every field
       trip it. Don't remove this; it's the only spam defence this form has. -->
  <input type="text" name="hp" style="position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">

  <button type="submit">Send enquiry</button>
  <div id="bb-enquiry-status" style="margin-top:8px;font-size:0.9em;"></div>
</form>

<script>
(function(){
  var form = document.getElementById('bb-enquiry-form');
  var status = document.getElementById('bb-enquiry-status');
  var CLIENT_ID = 'e8576821-e0d7-468c-9c18-9301cc1e8d82'; // ← replace with the real client id

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var data = Object.fromEntries(new FormData(form));
    data.client_id = CLIENT_ID;
    data.source = 'website_form';

    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    status.textContent = 'Sending…';

    fetch('https://building-brain.jwa7990.workers.dev', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign({mode: 'submit_lead'}, data))
    })
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.error) throw new Error(json.error);
      form.reset();
      form.style.display = 'none';
      status.textContent = "Thanks — we'll be in touch shortly.";
    })
    .catch(function(){
      btn.disabled = false;
      status.textContent = "Something went wrong — please try again, or call/email us directly.";
    });
  });
})();
</script>
